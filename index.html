<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>균열 원정대 (Riftbound Expedition)</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <div id="top">
    <div id="waveBox">스테이지 <b id="wave">0</b></div>
    <div id="lanternBar"><div id="lanternFill"></div><span id="lanternTxt"></span></div>
    <div id="infoBox">처치 <b id="kills">0</b> · 은화 <b id="embers">0</b></div>
    <button id="flareBtn">플레어 0%</button>
    <button id="campBtn">정비</button>
    <button id="speedBtn">1배속</button>
    <button id="modeBtn">수동</button>
  </div>
  <div id="synergy"></div>
  <div id="party"></div>
  <div id="bossBar" class="hidden"><div id="bossName"></div><div class="bar"><div id="bossFill"></div></div></div>
  <div id="stick" class="hidden"><div id="knob"></div></div>
  <div id="toast"></div>
</div>
<div id="menu" class="panel">
  <h1 id="title">균열 원정대 (Riftbound Expedition)</h1>
  <p class="sub">어둠이 중세, 현대, 우주의 시대를 삼킨 뒤, 마지막 등불 아래 모인 21인의 생존자.</p>
  <div id="meta"></div>
  <div id="tabs"></div>
  <div id="grid"></div>
  <details><summary>조작 방법 / 크레딧과 라이선스</summary>
    <p class="help">수동 모드: WASD/방향키(모바일은 왼쪽 아래 조이스틱)로 선두 영웅을 움직이고, 나머지는 따라오며 자동 전투. Space(또는 상단 버튼)로 위임 모드로 바꾸면 전원이 알아서 싸웁니다.</p>
    <div id="credits"></div><button id="resetBtn" class="ghost">저장 초기화</button></details>
  <div id="dock">
    <div id="slots"></div>
    <div id="preview"></div>
    <button id="contBtn" class="hidden">이어하기</button>
    <button id="startBtn" disabled>출정</button>
  </div>
</div>
<div id="detail" class="hidden"><div class="dbox"><canvas id="pv" width="260" height="320"></canvas><div id="dtext"></div><div class="row"><button id="dsel" class="mbtn"></button><button id="dclose" class="ghost">닫기</button></div></div></div>
<div id="modal" class="panel hidden"></div>
<div id="loading" class="hidden">불러오는 중…</div>
<script src="fx/effekseer.min.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
